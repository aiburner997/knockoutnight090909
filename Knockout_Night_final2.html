<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Knockout Night</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{--bg:#eceef3;--fg:#15151c;--accent:#e63946;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#08080d;--fg:#f4f4f6}}
:root[data-theme="dark"]{--bg:#08080d;--fg:#f4f4f6}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:'Bebas Neue',Impact,'Arial Narrow',sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
#wrap{position:relative;width:min(100vw,calc((100dvh - 130px)*16/9),960px);aspect-ratio:16/9;border-radius:12px;overflow:hidden;box-shadow:0 18px 60px rgba(0,0,0,.45)}
canvas{width:100%;height:100%;display:block}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(6px,1.6vw,16px);background:radial-gradient(ellipse at center,rgba(10,8,20,.72),rgba(4,3,10,.92));color:#fff;text-align:center;padding:12px}
#ttl{margin:0;font-weight:400;font-size:clamp(40px,10vw,104px);line-height:.9;letter-spacing:2px;color:#fff;text-shadow:0 4px 0 #e63946,0 10px 30px rgba(0,0,0,.6)}
#sub{margin:0;font-family:system-ui,sans-serif;font-size:clamp(12px,1.8vw,17px);opacity:.85}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btn{font:inherit;font-size:clamp(16px,2.6vw,24px);letter-spacing:2px;padding:6px 18px;border:2px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);color:#fff;border-radius:8px;cursor:pointer}
.btn:hover{background:rgba(255,255,255,.18)}
.btn:focus-visible{outline:3px solid #ffd166;outline-offset:2px}
.btn.on{background:var(--accent);border-color:var(--accent)}
.btn.go{font-size:clamp(24px,4vw,40px);padding:6px 38px;background:#ffd166;border-color:#ffd166;color:#15151c}
.btn.go:hover{background:#ffe08e}
.hint{margin:0;font-family:system-ui,sans-serif;font-size:clamp(11px,1.5vw,14px);opacity:.7;line-height:1.5}
#hint{margin:0;font-family:system-ui,sans-serif;font-size:13px;opacity:.65}
#pad{display:none;width:min(100vw,960px);justify-content:space-between;padding:0 10px;box-sizing:border-box}
#pad .g{display:flex;gap:8px}
#pad button{font:inherit;font-size:22px;letter-spacing:1px;min-width:64px;height:58px;padding:0 12px;border-radius:12px;border:2px solid rgba(255,255,255,.25);background:#262633;color:#fff;touch-action:none}
#pad button:active{background:var(--accent)}
@media (pointer:coarse){#pad{display:flex}#hint{display:none}.hint.kb{display:none}}
#ttl{background:linear-gradient(180deg,#fff,#b9c0d0);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 4px 0 #e63946) drop-shadow(0 10px 24px rgba(0,0,0,.6))}
#diff,#mode{gap:0;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);border-radius:11px;padding:3px}
#diff .btn,#mode .btn{border:0;background:transparent;border-radius:8px;font-size:clamp(14px,2.2vw,20px);padding:6px 16px}
#diff .btn.on,#mode .btn.on{background:#e63946}
.btn.go{background:linear-gradient(180deg,#ffe08e,#f2b632);border:0;border-radius:10px;box-shadow:0 5px 0 #a87a14,0 12px 30px rgba(0,0,0,.45);transition:transform .08s}
.btn.go:active{transform:translateY(3px);box-shadow:0 2px 0 #a87a14}
.keys{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;font-family:system-ui,sans-serif;font-size:12px;opacity:.9}
.keys span{display:flex;align-items:center;gap:5px}
.keys b{min-width:22px;height:22px;padding:0 4px;box-sizing:border-box;display:inline-grid;place-items:center;border:1px solid rgba(255,255,255,.35);border-bottom-width:3px;border-radius:5px;background:rgba(255,255,255,.08);font-weight:600}
@media (pointer:coarse){.keys{display:none}}
#tools{position:absolute;right:8px;bottom:8px;display:none;gap:6px}
#tools button{font:inherit;font-size:14px;letter-spacing:1px;padding:3px 10px;border-radius:7px;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.5);color:#fff;cursor:pointer}
#tools button:hover{background:rgba(255,255,255,.2)}
#shop{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;gap:8px;padding:14px 16px;background:rgba(6,5,14,.98);color:#fff;overflow:auto;touch-action:pan-y;box-sizing:border-box;font-family:system-ui,sans-serif;font-size:clamp(10px,1.7vw,13px);line-height:1.4;text-align:left}
.u{display:flex;align-items:center;gap:10px;width:100%;max-width:640px;border-bottom:1px solid rgba(255,255,255,.12);padding:3px 0}.u b{font:400 22px "Bebas Neue",Impact,sans-serif;letter-spacing:1px;width:120px}.u span{flex:1;font-size:12px}.u .btn{font-size:16px;padding:3px 12px;min-width:84px}.u .btn:disabled{opacity:.35;cursor:default}#coins{font:400 26px "Bebas Neue",Impact,sans-serif;color:#fff;letter-spacing:2px}
.row.main{align-items:center}
#pad button.hl{background:#243a78;min-width:84px}
#pad button.hr{background:#8a2230;min-width:84px}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c" aria-label="Boxing ring"></canvas>
<div id="ov">
<h1 id="ttl">KNOCKOUT NIGHT</h1>
<p id="sub">Three rounds. Win by knockout or on points.</p>
<div class="row" id="mode"><button class="btn on" data-m="exh">EXHIBITION</button><button class="btn" data-m="camp">CAMPAIGN</button><button class="btn" data-m="2p">2 PLAYERS</button></div>
<div class="row" id="diff">
<button class="btn" data-d="easy">ROOKIE</button>
<button class="btn on" data-d="normal">CONTENDER</button>
<button class="btn" data-d="hard">CHAMPION</button>
</div>
<div class="row main"><button class="btn go" id="go">FIGHT</button><button class="btn" id="ubtn" style="display:none">UPGRADES</button></div>
<div class="keys" id="keys"></div>
</div>
<div id="shop"><h2>UPGRADES</h2><div id="coins"></div><div id="ups" style="width:100%;max-width:640px"></div><div class="row"><button class="btn go" id="sback">BACK</button><button class="btn" id="sreset">RESET PROGRESS</button></div></div>
<div id="tools"><button id="tpause">PAUSE</button><button id="tmute">SOUND ON</button></div>
</div>
<div id="pad">
<div class="g"><button data-k="left" aria-label="Move left">◀</button><button data-k="right" aria-label="Move right">▶</button></div>
<div class="g"><button data-k="block">BLOCK</button><button data-k="jab" class="hl" aria-label="Left hand">LEFT</button><button data-k="hook" class="hr" aria-label="Right hand">RIGHT</button></div>
</div>
<p id="hint">Left hand (J) is fast. Right hand (K) hits hard but leaves you open. Blocking drains stamina. Win campaign fights to earn coins and buy upgrades.</p>
<script>
(()=>{
'use strict';
const W=800,H=450,GY=374,MINX=112,MAXX=688,FONT='"Bebas Neue",Impact,"Arial Narrow",sans-serif';
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),bgc=document.createElement('canvas');
const ov=document.getElementById('ov'),ttl=document.getElementById('ttl'),sub=document.getElementById('sub'),go=document.getElementById('go'),tools=document.getElementById('tools'),shop=document.getElementById('shop'),tm=document.getElementById('tmute');
let dpr=1;
const MOVES={jab:{dur:.30,hit0:.08,hit1:.17,dmg:6,reach:88,st:7,kb:14,stun:.22},
 hook:{dur:.58,hit0:.27,hit1:.37,dmg:15,reach:80,st:20,kb:44,stun:.42}};
const DIFF={easy:{think:.8,aggr:.36,blk:.2,hook:.2,dm:.75,label:'ROOKIE'},
 normal:{think:.5,aggr:.55,blk:.45,hook:.3,dm:1,label:'CONTENDER'},
 hard:{think:.32,aggr:.72,blk:.68,hook:.38,dm:1.2,label:'CHAMPION'}};
const NM=[['ROOKIE RAY','#c99a6e','#2a9d8f','#f4f4f6'],['IRON MIKE','#8d5a3b','#f4a261','#222'],['SWIFT SAM','#e6b894','#4cc9f0','#fff'],['TWIN FANG','#e6b894','#7b2cbf','#ffd166'],['THE WALL','#6b4226','#555b6e','#ff4d5e'],['CRUSHER KANE','#a8734a','#d62828','#15151c'],['VIPER VEGA','#c99a6e','#2d6a4f','#b7e4c7'],['KING KNOCKOUT','#d9a066','#ffd166','#15151c']];
const lp=(a,b,t)=>a+(b-a)*t;
const CAMP=NM.map((n,i)=>{const t=i/(NM.length-1);return{name:n[0],skin:n[1],trunks:n[2],trim:n[3],glove:n[2],d:{think:lp(.9,.24,t),aggr:lp(.3,.85,t),blk:lp(.1,.8,t),hook:lp(.12,.46,t),dm:lp(.7,1.5,t),spd:lp(.85,1.2,t)}}});
const UPS=[['pw','POWER','+8% punch damage per level'],['tk','TOUGHNESS','-5% damage taken per level'],['st','STAMINA','faster stamina recovery'],['sp','SPEED','+4% footspeed per level'],['gd','GUARD','stronger block, less stamina drain']],MAXL=6,U0=()=>({pw:0,tk:0,st:0,sp:0,gd:0});
let sv={bout:0,coins:0,up:U0()};
try{const q=JSON.parse(localStorage.getItem('kn_save'));if(q&&q.up)sv={bout:Math.max(0,Math.min(q.bout|0,NM.length-1)),coins:q.coins|0,up:Object.assign(U0(),q.up)}}catch(e){}
let mode='exh',bout=sv.bout,cb=0;
const save=()=>{sv.bout=bout;try{localStorage.setItem('kn_save',JSON.stringify(sv))}catch(e){}};
const cur=()=>mode==='camp'?CAMP[bout].d:DIFF[diff];
function lite(c,k){const n=parseInt(c.slice(1),16);return'rgb('+[n>>16,n>>8&255,n&255].map(v=>v+(255-v)*k|0).join()+')'}
function shade(c){const n=parseInt(c.slice(1),16);return'rgb('+[n>>16,n>>8&255,n&255].map(v=>v*.82|0).join()+')'}
let diff='normal',ph='menu',pt=0,bt=0,T=0,round=1,timeLeft=45,shake=0,hs=0,paused=false,muted=false,koWho=null,endMsg='',roundSub='',zoom=0,shopOpen=false;
const rw={p:0,e:0},rd={p:0,e:0},playing=()=>ph!=='menu'&&ph!=='over';
const keys={left:false,right:false,block:false};
const parts=[],rings=[],floats=[],flashes=[];

function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function mk(name,dir,skin,trunks,trim,glove){return{name,dir,skin,trunks,trim,glove,x:0,hp:100,trail:100,st:100,state:'idle',t:0,move:null,hitDone:false,blocking:false,atkId:0,walk:0,mv:0,fall:0,stun:0,weak:false,pw:1,tk:1,sr:24,ms:1,gd:.12,gs:1,k:{left:false,right:false,block:false},buf:null,bob:Math.random()*6,hitT:0,ai:{timer:.6,mode:'wait',react:-1}}}
const P=mk('YOU',1,'#e0ac80','#e63946','#ffd166','#e63946');
const E=mk('CPU',-1,'#8d5a3b','#3a86ff','#f4f4f6','#3a86ff');
P.x=260;E.x=540;

/* ---------- audio ---------- */
let AC=null;
function ac(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){AC=null}return AC}
function noise(dur,freq,vol,type){const a=ac();if(!a)return;const n=Math.max(1,a.sampleRate*dur|0),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type=type||'lowpass';f.frequency.value=freq;const g=a.createGain();g.gain.value=vol;s.connect(f);f.connect(g);g.connect(a.destination);s.start()}
function tone(f0,f1,dur,vol,type){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime;o.type=type||'sine';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(a.destination);o.start();o.stop(t+dur)}
function sfx(n){if(muted)return;try{
 if(n==='hard'){noise(.2,500,.9);tone(160,50,.2,.8)}
 else if(n==='soft'){noise(.1,800,.6);tone(220,80,.1,.5)}
 else if(n==='block'){noise(.06,2500,.3,'highpass');tone(300,200,.06,.2,'square')}
 else if(n==='whoosh')noise(.12,2200,.07,'highpass');
 else if(n==='bell'){tone(1200,1190,1,.22);tone(2400,2380,.6,.08);tone(1800,1790,.8,.06)}
 else if(n==='ko'){tone(130,40,.7,.8,'sawtooth');noise(.5,300,.9);noise(1.4,1400,.14,'bandpass')}
}catch(e){}}

/* ---------- background ---------- */
function buildBG(){
 const b=bgc.getContext('2d');b.setTransform(dpr,0,0,dpr,0,0);
 let g=b.createLinearGradient(0,0,0,300);g.addColorStop(0,'#05050a');g.addColorStop(1,'#1b1233');b.fillStyle=g;b.fillRect(0,0,W,H);
 const r=rng(7);
 for(let row=0;row<5;row++){const y=118+row*34,rad=12+row*2.5;for(let x=-10;x<W+20;x+=rad*1.9){b.fillStyle='hsl('+(220+r()*90|0)+',30%,'+(7+row*2.5+r()*4).toFixed(1)+'%)';b.beginPath();b.arc(x+r()*8,y+r()*8,rad,0,7);b.fill();b.fillRect(x-rad*.9,y+rad*.6,rad*1.8,44)}}
 b.globalCompositeOperation='lighter';
 [150,400,650].forEach(x=>{const gr=b.createLinearGradient(x,0,x,330);gr.addColorStop(0,'rgba(255,236,190,.3)');gr.addColorStop(1,'rgba(255,236,190,0)');b.fillStyle=gr;b.beginPath();b.moveTo(x-8,0);b.lineTo(x+8,0);b.lineTo(x+95,330);b.lineTo(x-95,330);b.fill()});
 b.globalCompositeOperation='source-over';
 const mg=b.createLinearGradient(0,300,0,420);mg.addColorStop(0,'#272b3a');mg.addColorStop(1,'#4a5068');
 b.fillStyle=mg;b.beginPath();b.moveTo(90,300);b.lineTo(710,300);b.lineTo(800,420);b.lineTo(0,420);b.closePath();b.fill();
 b.strokeStyle='rgba(255,255,255,.22)';b.lineWidth=3;b.stroke();
 b.fillStyle='#7d1827';b.fillRect(0,420,W,30);b.fillStyle='rgba(255,255,255,.14)';b.fillRect(0,420,W,3);
 b.save();b.translate(400,368);b.scale(1,.22);b.strokeStyle='rgba(255,255,255,.22)';b.lineWidth=10;b.beginPath();b.arc(0,0,150,0,7);b.stroke();
 b.fillStyle='rgba(230,57,70,.4)';b.font='130px '+FONT;b.textAlign='center';b.textBaseline='middle';b.fillText('KO',0,6);b.restore();
 const cols=['#e63946','#f1f1f4','#e63946'],bY=[180,222,264],fY=[232,292,352];
 for(let i=0;i<3;i++){b.strokeStyle=cols[i];b.lineWidth=5;b.lineCap='round';b.beginPath();b.moveTo(96,bY[i]);b.lineTo(704,bY[i]);b.moveTo(14,fY[i]);b.lineTo(96,bY[i]);b.moveTo(786,fY[i]);b.lineTo(704,bY[i]);b.stroke();
  b.strokeStyle='rgba(255,255,255,.3)';b.lineWidth=1.5;b.beginPath();b.moveTo(96,bY[i]-1.5);b.lineTo(704,bY[i]-1.5);b.stroke()}
 [[96,300,160],[704,300,160],[14,420,200],[786,420,200]].forEach(p=>{b.fillStyle='#14141c';b.fillRect(p[0]-5,p[2],10,p[1]-p[2]);b.fillStyle='#e63946';b.fillRect(p[0]-7,p[2]+8,14,34)});
}
function size(){dpr=Math.min(2,window.devicePixelRatio||1);cv.width=W*dpr;cv.height=H*dpr;bgc.width=W*dpr;bgc.height=H*dpr;buildBG()}

/* ---------- fighters ---------- */
function rrect(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h)}
function drawF(f){
 const m=f.move?MOVES[f.move]:null,st=f.state,blk=f.blocking&&st==='idle';
 const bob=st==='idle'?Math.sin(T*6+f.bob)*1.6:0;
 const e=st==='atk'?Math.sin(Math.PI*Math.min(1,f.t/m.dur)):0,hook=st==='atk'&&f.move==='hook',jab=st==='atk'&&f.move==='jab';
 ctx.save();ctx.translate(f.x,GY);
 ctx.save();ctx.translate(0,3);ctx.scale(1,.24);const sg=ctx.createRadialGradient(0,0,4,0,0,46);sg.addColorStop(0,'rgba(0,0,0,.6)');sg.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=sg;ctx.beginPath();ctx.arc(0,0,46,0,7);ctx.fill();ctx.restore();
 ctx.scale(f.dir,1);if(f.hitT>0&&'filter' in ctx)ctx.filter='brightness('+(1+f.hitT*6)+')';
 if(st==='hurt'){ctx.translate(-7,0);ctx.rotate(-.13)}
 if(st==='ko'){ctx.translate(-f.fall*38,0);ctx.rotate(-f.fall*1.5)}
 const sw=f.mv?Math.sin(f.walk)*8:0,lead=jab?e*8:hook?e*4:0;
 const leg=cx=>{const g=ctx.createLinearGradient(cx-9,0,cx+9,0);g.addColorStop(0,shade(f.skin));g.addColorStop(.5,lite(f.skin,.08));g.addColorStop(1,shade(f.skin));ctx.fillStyle=g;rrect(cx-8.5,-64,17,64,6);ctx.fill();
  ctx.fillStyle='rgba(0,0,0,.13)';ctx.beginPath();ctx.ellipse(cx+1,-36,5.5,4.5,0,0,7);ctx.fill();ctx.fillStyle='rgba(255,255,255,.1)';ctx.fillRect(cx-3,-58,3,18);
  ctx.fillStyle=f.trim;rrect(cx-9.5,-22,19,8,3);ctx.fill();ctx.fillStyle=f.trunks;ctx.fillRect(cx-9.5,-19,19,2);
  ctx.fillStyle='#1b1b26';rrect(cx-9.5,-13,28,13,6);ctx.fill();ctx.fillStyle=f.trunks;rrect(cx-4,-12,16,3,1.5);ctx.fill();
  ctx.fillStyle='#e9e9f0';ctx.fillRect(cx-9,-2,28,3);ctx.fillStyle='rgba(255,255,255,.22)';ctx.fillRect(cx-6,-11,14,1.5)};
 leg(-14-sw);leg(14+sw+lead);
 ctx.save();ctx.translate(jab?e*9:hook?e*14:0,-72+bob);
 ctx.rotate(hook?e*.24:jab?e*.1:blk?-.07:0);
 let fg={x:30,y:-72},rg={x:17,y:-60};
 if(blk){fg={x:24,y:-82};rg={x:13,y:-70}}
 if(st==='hurt'){fg={x:20,y:-52};rg={x:6,y:-44}}
 if(st==='ko'){fg={x:20,y:-36};rg={x:2,y:-30}}
 if(jab){const q=Math.min(1,f.t/m.dur),a=q<.35?q/.35:1-(q-.35)/.65,j=a*a*(3-2*a);fg={x:30+32*j,y:-72+8*j,fx:j}}
 if(hook){const q=Math.min(1,f.t/m.dur),c=q<.2?q/.2:1,s=Math.max(0,Math.min(1,(q-.2)/.3)),r=q>.52?(q-.52)/.48:0,w=c*(1-s)*(1-r),sw=s*s*(3-2*s)*(1-r);rg={x:17-25*w+33*sw,y:-60-8*w-16*sw-9*Math.sin(Math.PI*s)*(1-r),b:1-1.7*sw,fx:sw}}
 const arm=(sx,sy,g,dark)=>{const L1=28,L2=27,SD=shade(f.skin),sk=dark?SD:f.skin;
  const dx=g.x-sx,dy=g.y-sy,d=Math.hypot(dx,dy)||1,dd=Math.min(Math.max(d,12),L1+L2-.5),ux=dx/d,uy=dy/d,gx=sx+ux*dd,gy=sy+uy*dd;
  const a=(L1*L1-L2*L2+dd*dd)/(2*dd),h=Math.sqrt(Math.max(0,L1*L1-a*a))*(g.b===undefined?1:g.b),ex=sx+ux*a-uy*h,ey=sy+uy*a+ux*h;
  if(g.fx>.4){ctx.strokeStyle='rgba(255,255,255,'+(.4*g.fx)+')';ctx.lineWidth=15;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(gx-34,gy+3);ctx.lineTo(gx-10,gy);ctx.stroke()}
  ctx.strokeStyle=sk;ctx.fillStyle=sk;ctx.lineCap='round';ctx.lineWidth=12.5;ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(ex,ey);ctx.stroke();
  ctx.lineWidth=10.5;ctx.beginPath();ctx.moveTo(ex,ey);ctx.lineTo(gx,gy);ctx.stroke();ctx.beginPath();ctx.arc(ex,ey,5.5,0,7);ctx.fill();
  if(!dark){ctx.strokeStyle='rgba(255,255,255,.16)';ctx.lineWidth=3.5;ctx.beginPath();ctx.moveTo(sx+(ex-sx)*.3,sy+(ey-sy)*.3-2);ctx.lineTo(sx+(ex-sx)*.8,sy+(ey-sy)*.8-2);ctx.stroke()}
  const an=Math.atan2(gy-ey,gx-ex),cx=gx+Math.cos(an)*5,cy=gy+Math.sin(an)*5;

  const c=col(f.hp);pill(x,34,310,18,f.hp,f.trail,fl,c[0],c[1]);pill(fl?582:28,58,190,6,f.st,f.st,fl,'#8be9ff','#1ba7d6');
  ctx.fillStyle=cc;rrect(fl?766:28,10,6,20,3);ctx.fill();ctx.textBaseline='alphabetic';ctx.font='15px '+FONT;
  if(fl){ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,.55)';ctx.fillText(tag,756,27);const w=ctx.measureText(tag).width;ctx.font='26px '+FONT;ctx.fillStyle='#fff';ctx.fillText(nm,756-w-8,29)}
  else{ctx.textAlign='left';ctx.font='26px '+FONT;ctx.fillStyle='#fff';ctx.fillText(nm,42,29)}
 });
 ctx.fillStyle='rgba(8,8,16,.9)';rrect(344,10,112,62,14);ctx.fill();ctx.strokeStyle='rgba(255,209,102,.55)';ctx.lineWidth=1.5;rrect(344,10,112,62,14);ctx.stroke();
 ctx.textAlign='center';ctx.textBaseline='alphabetic';ctx.fillStyle='#ffd166';ctx.font='15px '+FONT;ctx.fillText('ROUND '+round+' OF 3',400,28);
 const tl=Math.max(0,Math.ceil(timeLeft));ctx.fillStyle=tl<=10&&ph==='fight'?'#ff5a68':'#fff';ctx.font='38px '+FONT;ctx.fillText(String(tl),400,62);
 for(let i=0;i<3;i++)[[36+i*16,rw.p],[764-i*16,rw.e]].forEach(([x,n])=>{ctx.beginPath();ctx.arc(x,80,5,0,7);ctx.fillStyle=i<n?'#ffd166':'rgba(255,255,255,.2)';ctx.fill()});
}
let vig=null;
function render(){
 ctx.setTransform(dpr,0,0,dpr,0,0);
 ctx.clearRect(0,0,W,H);
 ctx.fillStyle='#05050a';ctx.fillRect(0,0,W,H);
 ctx.save();const zs=1.03+zoom;ctx.translate(W/2+(Math.random()-.5)*shake,H*.8+(Math.random()-.5)*shake);ctx.scale(zs,zs);ctx.translate(-W/2,-H*.8);
 ctx.drawImage(bgc,0,0,W,H);
 flashes.forEach(f=>{ctx.fillStyle='rgba(255,255,255,'+(f.l/.18)+')';ctx.beginPath();ctx.arc(f.x,f.y,3,0,7);ctx.fill()});
 (P.state==='atk'?[E,P]:[P,E]).forEach(drawF);
 parts.forEach(p=>{ctx.globalAlpha=Math.min(1,p.l*3);ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.s,p.s)});ctx.globalAlpha=1;
 rings.forEach(r=>{ctx.globalAlpha=r.l/.3;ctx.strokeStyle=r.c;ctx.lineWidth=4;ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,7);ctx.stroke()});ctx.globalAlpha=1;
 floats.forEach(f=>{ctx.save();ctx.translate(f.x,f.y);ctx.rotate(-.08);const pp=1+Math.max(0,f.l-.7)*2;ctx.scale(pp,pp);ctx.globalAlpha=Math.min(1,f.l*2.5);outlined(f.t,0,0,34,f.c,'center');ctx.restore()});
 ctx.restore();
 if(!vig){vig=ctx.createRadialGradient(W/2,H/2,190,W/2,H/2,520);vig.addColorStop(0,'rgba(0,0,0,0)');vig.addColorStop(1,'rgba(0,0,0,.6)')}
 ctx.fillStyle=vig;ctx.fillRect(0,0,W,H);
 hud();
 if(ph==='intro')banner('ROUND '+round,null,'#fff',1.5-pt);
 else if(ph==='fight'&&bt<.8)banner('FIGHT!',null,'#ffd166',bt);
 else if(ph==='roundEnd')banner(endMsg,roundSub,'#ffd166',bt);
 else if(ph==='koEnd')banner('K.O.!',koWho===E?E.name+' is down':mode==='2p'?'PLAYER 1 is down':'You are down','#ff4d5e',bt);
 if(paused){ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,W,H);banner('PAUSED','Press P to resume','#fff',1)}
}

/* ---------- input ---------- */
const KEYMAP={arrowleft:'left',a:'left',arrowright:'right',d:'right',j:'jab',z:'jab',k:'hook',x:'hook',l:'block',s:'block',' ':'block',arrowdown:'block'};
const KM1={a:'left',d:'right',f:'jab',g:'hook',s:'block'},KM2={arrowleft:'left',arrowright:'right',k:'jab',l:'hook',arrowdown:'block'};
function route(k){if(mode==='2p')return KM1[k]?[P,KM1[k]]:KM2[k]?[E,KM2[k]]:null;const a=KEYMAP[k];return a?[P,a]:null}
function act(f,k,down){if(k==='jab'||k==='hook'){if(down&&ph==='fight'&&!paused)f.buf={a:k,t:.2}}else f.k[k]=down}
addEventListener('keydown',e=>{
 const k=e.key.toLowerCase();if(e.ctrlKey||e.metaKey||e.altKey)return;
 if(shopOpen){if(k==='escape'){e.preventDefault();showShop(false)}return}
 if(k==='m'&&!e.repeat){toggleMute();return}
 if(!playing()){const a=document.activeElement;if(k==='enter'&&ov.style.display!=='none'&&!(a&&a.tagName==='BUTTON'&&a!==go)){e.preventDefault();startMatch()}return}
 if(k==='p'&&!e.repeat){paused=!paused;return}
 const r=route(k);if(!r)return;e.preventDefault();if(e.repeat)return;act(r[0],r[1],true);
});
addEventListener('keyup',e=>{const r=route(e.key.toLowerCase());if(r)act(r[0],r[1],false)});
addEventListener('blur',()=>{[P,E].forEach(f=>{f.k.left=f.k.right=f.k.block=false;f.buf=null});if(playing())paused=true});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&ph!=='menu'&&ph!=='over')paused=true});
document.querySelectorAll('#pad button').forEach(b=>{
 const k=b.dataset.k;
 b.addEventListener('pointerdown',e=>{e.preventDefault();try{b.setPointerCapture(e.pointerId)}catch(_){}if(paused&&ph!=='menu'&&ph!=='over'){paused=false;return}act(P,k,true)});
 ['pointerup','pointercancel','lostpointercapture'].forEach(n=>b.addEventListener(n,()=>act(P,k,false)));
 b.addEventListener('contextmenu',e=>e.preventDefault());
});
document.querySelectorAll('#diff .btn').forEach(b=>b.addEventListener('click',()=>{
 diff=b.dataset.d;document.querySelectorAll('#diff .btn').forEach(x=>x.classList.toggle('on',x===b));
}));
go.addEventListener('click',startMatch);
const K1='<span><b>A</b><b>D</b>Move</span><span><b>J</b>Left hand</span><span><b>K</b>Right hand</span><span><b>L</b>Block</span><span><b>P</b>Pause</span><span><b>M</b>Mute</span>',K2='<span>P1: <b>A</b><b>D</b>Move</span><span><b>F</b>Left</span><span><b>G</b>Right</span><span><b>S</b>Block</span><span>P2: <b>←</b><b>→</b>Move</span><span><b>K</b>Left</span><span><b>L</b>Right</span><span><b>↓</b>Block</span><span><b>P</b>Pause</span>';
function bits(){document.getElementById('diff').style.display=mode==='exh'?'':'none';document.getElementById('ubtn').style.display=mode==='camp'?'':'none';document.getElementById('keys').innerHTML=mode==='2p'?K2:K1}
function menuText(){ttl.textContent='KNOCKOUT NIGHT';ttl.style.color='';go.textContent='FIGHT';sub.textContent=mode==='camp'?'Campaign · Fight '+(bout+1)+'/'+CAMP.length+': '+CAMP[bout].name+' · '+sv.coins+' coins':mode==='2p'?'Local 2 players. Three rounds. Win by knockout or on points.':'Three rounds. Win by knockout or on points.';bits()}
document.querySelectorAll('#mode .btn').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.m;document.querySelectorAll('#mode .btn').forEach(x=>x.classList.toggle('on',x===b));menuText()}));
document.getElementById('ubtn').onclick=()=>showShop(true);
function toggleMute(){muted=!muted;tm.textContent=muted?'SOUND OFF':'SOUND ON'}
function showShop(v){shopOpen=v;shop.style.display=v?'flex':'none';if(v){drawShop();document.getElementById('sback').focus()}else{if(ph==='menu')menuText();go.focus()}}
function drawShop(){document.getElementById('coins').textContent='COINS: '+sv.coins;document.getElementById('ups').innerHTML=UPS.map(([k,n,d])=>{const l=sv.up[k],c=50+40*l,mx=l>=MAXL;return'<div class="u"><b>'+n+'</b><span>'+d+'<br>'+'●'.repeat(l)+'○'.repeat(MAXL-l)+'</span><button class="btn" data-u="'+k+'"'+(mx||sv.coins<c?' disabled':'')+'>'+(mx?'MAX':'BUY '+c)+'</button></div>'}).join('')}
document.getElementById('ups').onclick=e=>{const b=e.target.closest('button[data-u]');if(!b||b.disabled)return;const k=b.dataset.u,c=50+40*sv.up[k];if(sv.up[k]<MAXL&&sv.coins>=c){sv.coins-=c;sv.up[k]++;save();drawShop();sfx('bell')}};
document.getElementById('sback').onclick=()=>showShop(false);
const sr=document.getElementById('sreset');sr.onclick=()=>{if(sr.dataset.c){delete sr.dataset.c;sr.textContent='RESET PROGRESS';sv={bout:0,coins:0,up:U0()};bout=0;save();drawShop()}else{sr.dataset.c=1;sr.textContent='CLICK AGAIN TO CONFIRM'}};
document.getElementById('tpause').onclick=()=>{if(playing())paused=!paused};tm.onclick=toggleMute;
cv.addEventListener('pointerdown',()=>{if(paused)paused=false});

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){
 const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;
 try{step(dt);render()}catch(err){console.error(err)}
 requestAnimationFrame(frame);
}
menuText();size();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(buildBG);
addEventListener('resize',()=>{const d=Math.min(2,window.devicePixelRatio||1);if(d!==dpr)size()});
requestAnimationFrame(frame);
})();
</script>
